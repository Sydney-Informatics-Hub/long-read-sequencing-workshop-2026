site_name: template-mkdocs
repo_url: https://github.com/Sydney-Informatics-Hub/template-mkdocs
repo_name: Sydney-Informatics-Hub/template-mkdocs

nav:
  # Landing page
  - Home: index.md 
  # Example top-level page
  - Setup: 00.setup.md
  - Samples: 00.samples.md
  - Training format: 00.format.md
  - Tips and recommendations: 00.tips.md
  - Quiz: 00.quiz.md
  - Glossary: 00.glossary.md
  - Day 1:
    - Lesson 1 - Introduction to long read sequencing: 01.intro.md
    - Lesson 2 - Quality control: 02.qc.md
    - Lesson 3 - Pre-processing: 03.preprocess.md
    - Lesson 4 - Species identification: 04.species.md
    - Lesson 5 - Genome assembly: 05.assembly.md
  - Day 2:
    - Lesson 6 - Plasmid assembly and recovery: 06.plasmids.md
    - Lesson 7 - Assembly quality control and visualisation: 07.assembly_qc.md
    - Lesson 8 - Genome assembly polishing: 08.polish.md
    - Lesson 9 - Genome annotation and AMR screening: 09.annotation.md
  # Example nested page
  # - Part 1:
  #   - Introduction: part1/intro.md

theme:
  name: material
  logo: assets/usyd-logo.png
  features:
    - navigation.footer
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.superfences

extra:
  analytics:
    provider: google
    property: G-TNWWV3HK57
